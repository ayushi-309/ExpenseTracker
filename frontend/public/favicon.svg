<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <style>
      .outline { stroke: #1b494b; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
      .fill-calc { fill: #97b5ba; }
      .fill-screen { fill: #8adbf0; }
      .fill-btn { fill: #eef6f7; }
      .fill-coin { fill: #f3be3a; }
      .fill-handle { fill: #9188c4; }
      .text-dollar { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; fill: #1b494b; font-size: 32px; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <!-- Calculator Body -->
  <rect x="42" y="62" width="68" height="96" rx="10" class="fill-calc outline" />

  <!-- Calculator Screen -->
  <rect x="51" y="72" width="50" height="20" rx="4" class="fill-screen outline" />

  <!-- Buttons Grid -->
  <!-- Row 1 -->
  <rect x="51" y="100" width="10" height="10" rx="2" class="fill-btn outline" />
  <rect x="66" y="100" width="10" height="10" rx="2" class="fill-btn outline" />
  <rect x="81" y="100" width="10" height="10" rx="2" class="fill-btn outline" />

  <!-- Row 2 -->
  <rect x="51" y="115" width="10" height="10" rx="2" class="fill-btn outline" />
  <rect x="66" y="115" width="10" height="10" rx="2" class="fill-btn outline" />
  <rect x="81" y="115" width="10" height="10" rx="2" class="fill-btn outline" />

  <!-- Row 3 -->
  <rect x="51" y="130" width="10" height="10" rx="2" class="fill-btn outline" />
  <rect x="66" y="130" width="10" height="10" rx="2" class="fill-btn outline" />
  <rect x="81" y="130" width="10" height="22" rx="2" class="fill-btn outline" />

  <!-- Magnifying Glass Handle Underneath -->
  <path d="M 124 84 L 148 108" stroke="#1b494b" stroke-width="16" stroke-linecap="round" />
  <path d="M 124 84 L 148 108" stroke="#9188c4" stroke-width="8" stroke-linecap="round" />

  <!-- Dollar Coin Lens -->
  <circle cx="108" cy="68" r="30" class="fill-coin outline" />
  <!-- Dollar Symbol -->
  <text x="108" y="70" class="text-dollar">$</text>
</svg>
